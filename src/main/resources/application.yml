

spring:
  application:
    name: First Spring Application

    security:
      jwt:
        secret-key: @jwt.secret-key@
        expiration: @jwt.expiration@
        token-prefix: "Bearer"
        header-string: Autorization

server:
  port: @server.port@


---
spring:
  config:
    activate:
      on-profile:  develop
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    driverClassName: org.h2.Driver
    url: @develop.db.url@
    username: @develop.db.user@
    password: @develop.db.passwd@

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql


logging:
  level:
    org:
      springframework: INFO

      hibernate:
        SQL: DEBUG
        type: TRACE

---
spring:
  config:
    activate:
      on-profile:  prod
  datasource:
    driverClassName: org.postgresql.Driver
    url: @prod.db.url@
    username: @prod.db.user@
    password: @prod.db.passwd@
jpa:
  databasePlatform: org.hibernate.dialect.PostgreSQLDialect


springdoc:
  api-docs:
    path: /api/v1-api/docs
    show-actuator: true


---





